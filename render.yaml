#  Render deployment — darwin cadence operator (FREE tier).
#
#  Deployed as a Web Service (not a Background Worker) so it qualifies for
#  Render's free tier. cadence-server.ts wraps cadence.ts with a tiny HTTP
#  health endpoint that UptimeRobot pings every 5 min to prevent spin-down.
#
#  Secrets: set PRIVATE_KEY and LLM_AGENT_ID in the Render dashboard
#  under Environment → Secret Files / Environment Variables.
#
#  Deploy:
#    1. Connect your GitHub repo at dashboard.render.com → New Web Service
#    2. Render builds the Dockerfile automatically
#    3. Set secrets in the Environment tab
#    4. UptimeRobot pings your-app.onrender.com every 5 min

services:
  - type: web
    name: darwin-cadence
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    envVars:
      # ── Required (set manually in Render dashboard) ──
      - key: PRIVATE_KEY
        sync: false
      - key: LLM_AGENT_ID
        sync: false
      # ── Network defaults ──
      - key: SOMNIA_RPC_URL
        value: https://dream-rpc.somnia.network
      - key: SOMNIA_CHAIN_ID
        value: "50312"

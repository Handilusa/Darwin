#  Render deployment — darwin cadence operator.
#
#  Render reads this file from the repo root on connect.
#  The cadence is a WORKER service: no HTTP port, no public URL,
#  always-on by design.
#
#  Secrets: set PRIVATE_KEY and LLM_AGENT_ID as "secret" env vars
#  in the Render dashboard (they'll be marked sync: false below,
#  meaning you must set them manually per environment).
#
#  Deploy:
#    1. Push to your connected GitHub repo, OR
#    2. render deploy (if using the CLI)

services:
  - type: worker
    name: darwin-cadence
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    envVars:
      # ── Required (set manually in Render dashboard) ──
      - key: PRIVATE_KEY
        sync: false
      - key: LLM_AGENT_ID
        sync: false
      # ── Network defaults (override in dashboard if needed) ──
      - key: SOMNIA_RPC_URL
        value: https://dream-rpc.somnia.network
      - key: SOMNIA_CHAIN_ID
        value: "50312"

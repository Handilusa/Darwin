# Foundry configuration — DARWIN contracts
#
# EVM VERSION: `shanghai`, changed from `paris` on 2026-08-29 because paris made the
# deploy impossible, not merely conservative.
#
# `evm_version` configures BOTH solc's target and the EVM spec forge executes with.
# Any script that touches a live Shannon contract therefore executes that contract's
# fetched bytecode under this spec — and the deployed DreamDEX contracts use PUSH0
# (Shanghai). Under `paris`, `forge script Deploy.s.sol --rpc-url <shannon>` dies on
# its very first live call, `IERC20Like(TUSDC).decimals()`, with:
#
#     EvmError: NotActivated  →  Error: script failed: <empty revert data>
#
# which names neither PUSH0 nor evm_version. `--broadcast` simulates before sending,
# so this was not a dry-run-only problem: the Day-2 deploy would have failed at the
# first command. Verified by re-running the same script unchanged under `shanghai` and
# `cancun` — both simulate the full deploy clean (~11.9M gas, ~0.143 STT).
#
# Shannon's supported fork is no longer unconfirmed: its own production contracts
# contain PUSH0 and execute, so the chain is at least Shanghai. `shanghai` is chosen
# over `cancun` deliberately — it is the minimum that works and the maximum the
# evidence supports. The cancun simulation passing says nothing about Shannon; it only
# exercised local revm.
#
# This does NOT weaken the reasoning behind `Population`'s explicit
# `constructor() { _disableInitializers(); }`. That guards against `selfdestruct` on the
# implementation, and EIP-6780 is a *Cancun* change — still not assumed here.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# REQUIRED, not a preference. `IPriceSource.currentWindow` returns nine values, and
# the legacy codegen's ABI encoder cannot even build that return frame ("dataEnd is
# 2 slots too deep"), let alone decode it inside `think()`'s request loop. The IR
# pipeline is solc's own prescribed fix. It does NOT affect storage layout, so
# STORAGE.md's tables remain valid.
via_ir = true
# Organisms carry their genome as an on-chain string, so revert strings and long
# prompt literals push contract size. Watch this if Population grows.
# ignored_error_codes = []

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# `../genomes` is read by script/Seed.s.sol; `deployments` is written by
# script/Deploy.s.sol and read by every later script, the monitor and the frontend.
# Nothing else gets filesystem access — a broadcast script with wide fs rights is a
# footgun in a repo that will be public.
#
# The genome directory sits ABOVE this Foundry root (`darwin/genomes`, not
# `darwin/contracts/genomes`) because the frontend and the cadence scripts read the
# same file, and two copies of the founding population would drift. If forge ever
# refuses the parent path, move `genomes/` under `contracts/` and update both this
# entry and the path in Seed.s.sol — nothing else depends on the location.
fs_permissions = [
  { access = "read", path = "../genomes" },
  { access = "read-write", path = "./deployments" },
]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
somnia = "${SOMNIA_RPC_URL}"

[etherscan]
somnia = { key = "${SOMNIA_EXPLORER_KEY}", url = "https://shannon-explorer.somnia.network/api", chain = 50312 }

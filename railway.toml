#  Railway deployment — darwin cadence operator.
#
#  Railway reads this file automatically from the repo root.
#  The cadence is a WORKER (no HTTP, no port). Railway's "Background Worker"
#  service type keeps it alive 24/7 without a health check endpoint.
#
#  Secrets: configure PRIVATE_KEY, LLM_AGENT_ID, SOMNIA_RPC_URL, and any
#  other env vars from .env.example in the Railway dashboard under
#  Variables → Raw Editor. Never commit secrets to this file.
#
#  Deploy:
#    1. railway login
#    2. railway link  (or create a new project in the dashboard)
#    3. railway up    (or connect your GitHub repo for auto-deploy)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No health check — this is a worker process without an HTTP port.
# Railway keeps it alive based on the restart policy alone.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

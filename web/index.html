<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DARWIN — on-chain population</title>
    <meta
      name="description"
      content="A live view of an on-chain population of AI forecasters on Somnia Shannon. Reads one contract; no indexer, no backend, no wallet."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060d0c" />

    <!--
      One stylesheet link, and it pulls `fonts.css` and `tokens.css` in through `@import` in that
      order. Deliberately not three <link>s: the cascade order fonts → tokens → app is load-bearing
      (tokens must be defined before anything reads them, and `app.css` must be able to override),
      and expressing it inside the stylesheet makes it impossible to break by reordering markup.
      `app/src/styles.css` imports the same two files the same way, which is what keeps the landing
      and this console one design system rather than two that resemble each other.
    -->
    <link rel="stylesheet" href="app.css" />

    <!--
      The `@import` chain costs two hops before a font request can even start, so the two faces the
      entire interface is set in are asked for from here instead. `crossorigin` is not optional even
      though these are same-origin: fonts fetch in CORS mode, and without it the browser discards
      the preload and downloads the file a second time. The two serif faces are deliberately NOT
      preloaded — they carry genomes and organism names, `font-display: swap` covers them, and
      146KB of italic Newsreader must not compete with the RPC call this page exists to make.
    -->
    <link rel="preload" href="vendor/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="vendor/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      One living cell and one speck of ash — the whole thesis at 16px. `app/index.html` carries the
      identical mark, because the landing and the arena are one product and a judge who clicks
      through must not see the tab change identity.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060d0c'/%3E%3Ccircle cx='15' cy='17' r='9.5' fill='none' stroke='%235fe3c0' stroke-width='1.7'/%3E%3Ccircle cx='15' cy='17' r='2.6' fill='%235fe3c0'/%3E%3Ccircle cx='25.5' cy='6.5' r='2.2' fill='%237a7686'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      Deliberately almost empty. Every node below #banner and #body is created by render.js
      through `document.createTextNode`, because `Population.enter` lets anybody write the
      genome string this page displays (Population.sol:654) and a template-string renderer
      would be one missed escape away from running an entrant's script in an operator's
      browser. There is no `innerHTML` anywhere in web/ — grep for it as a review check.
    -->
    <header class="nav">
      <div class="nav-in">
        <a class="brand" href="/" title="Darwin — Home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="15" cy="17" r="9.5" fill="none" stroke="var(--life)" stroke-width="1.7" />
            <circle cx="15" cy="17" r="2.6" fill="var(--life)" />
            <circle cx="25.5" cy="6.5" r="2.2" fill="var(--ash)" />
          </svg>
          Darwin
        </a>

        <nav class="nav-links" aria-label="Sections">
          <a class="nav-link" href="/">The argument</a>
          <a class="nav-link is-current" href="/arena/">Arena</a>
        </nav>

        <a class="btn btn-primary nav-cta" href="/enter/">
          Launch App
        </a>
      </div>
    </header>
    <div id="banner"></div>
    <div id="header"></div>
    <main id="body">
      <noscript>
        <section class="panel">
          <h2>JavaScript is required</h2>
          <p>
            This page reads the population directly from a Somnia RPC in your browser — there is
            no server rendering it for you. That is the point: no indexer sits between the chain
            and this view.
          </p>
        </section>
      </noscript>
    </main>

    <footer class="footer">
      <p>
        DARWIN reads <code>Population.snapshot()</code> — the whole population in one
        <code>eth_call</code>. No indexer, no backend, no wallet, no build step.
      </p>
      <p class="muted">
        Somnia Shannon testnet, chain 50312. Add <code>?demo=1</code> for the offline fixture,
        <code>?population=0x…</code> to point it somewhere else.
      </p>
    </footer>

    <!--
      GSAP, from `web/vendor/` — a file in this repo, not a CDN. `?demo=1` is documented as working
      with the network unplugged, and an import from cdnjs would have broken exactly that, in a
      venue, at the worst possible moment. A plain script tag rather than a module import keeps the
      no-build promise too: `window.gsap` is defined before the module below runs.

      If this file is missing the page still renders complete and static — `js/motion.js` checks for
      the library on every call and becomes a no-op without it.
    -->
    <script src="vendor/gsap.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>

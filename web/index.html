<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DARWIN — on-chain population</title>
    <meta
      name="description"
      content="A live view of an on-chain population of AI forecasters on Somnia Shannon. Reads one contract; no indexer, no backend, no wallet."
    />
    <link rel="stylesheet" href="app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0f14'/%3E%3Cpath d='M9 23c4-3 4-11 8-14M23 9c-4 3-4 11-8 14' stroke='%2358d68d' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      Deliberately almost empty. Every node below #banner and #body is created by render.js
      through `document.createTextNode`, because `Population.enter` lets anybody write the
      genome string this page displays (Population.sol:575) and a template-string renderer
      would be one missed escape away from running an entrant's script in an operator's
      browser. There is no `innerHTML` anywhere in web/ — grep for it as a review check.
    -->
    <div id="banner"></div>
    <div id="header"></div>
    <main id="body">
      <noscript>
        <section class="panel">
          <h2>JavaScript is required</h2>
          <p>
            This page reads the population directly from a Somnia RPC in your browser — there is
            no server rendering it for you. That is the point: no indexer sits between the chain
            and this view.
          </p>
        </section>
      </noscript>
    </main>

    <footer class="footer">
      <p>
        DARWIN reads <code>Population.snapshot()</code> — the whole population in one
        <code>eth_call</code>. No indexer, no backend, no wallet, no build step.
      </p>
      <p class="muted">
        Somnia Shannon testnet, chain 50312. Add <code>?demo=1</code> for the offline fixture,
        <code>?population=0x…</code> to point it somewhere else.
      </p>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
